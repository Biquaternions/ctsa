name: Build Libraries

on:
  push:
    branches:
      - "master"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x86
            family: windows
          - os: windows-latest
            arch: x64
            family: windows
          - os: ubuntu-latest
            arch: x86
            family: linux
          - os: ubuntu-latest
            arch: x64
            family: linux
          - os: ubuntu-latest
            arch: arm64
            family: linux
          - os: macos-latest
            arch: x64
            family: macos

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.commits[0].message, '[ci skip]')"
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-13-aarch64-linux-gnu g++-13-aarch64-linux-gnu
          else
            sudo apt-get install -y build-essential
          fi

      - name: Configure CMake
        run: |
          cmake -B build-${{ matrix.arch }}
          cd build-${{ matrix.arch }}

          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ "${{ matrix.arch }}" = "x86" ]; then
              cmake .. -DCMAKE_C_FLAGS="-m32"
            elif [ "${{ matrix.arch }}" = "arm64" ]; then
              cmake .. -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-13
            else
              cmake ..
            fi
          fi
        shell: bash

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build-${{ matrix.arch }}
          cd build-${{ matrix.arch }}
          if ("${{ matrix.arch }}" -eq "x86") {
            cmake .. -A Win32 -DCMAKE_BUILD_TYPE=Release
          } else {
            cmake .. -DCMAKE_BUILD_TYPE=Release
          }

      - name: Build
        run: |
          cmake --build build-${{ matrix.arch }} --config Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: ctsa-${{ matrix.family }}-${{ matrix.arch }}
          path: |
            build-${{ matrix.arch }}/**/*.dll
            build-${{ matrix.arch }}/**/*.so
            build-${{ matrix.arch }}/**/*.dylib

      - name: Release ctsa
        uses: softprops/action-gh-release@master
        with:
          name: "🌧️ ctsa JNI (Build ${{ env.BUILD_NUMBER }})"
          tag_name: "auto-build"
          files: |
            **/*.dll
            **/*.so
            **/*.dylib
          token: "${{ secrets.GITHUB_TOKEN }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: false

